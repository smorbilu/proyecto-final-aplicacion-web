<h2 mat-dialog-title>
  <mat-icon>{{ isEdit ? 'edit' : 'add_task' }}</mat-icon>
  {{ isEdit ? 'Editar Tarea' : 'Nueva Tarea' }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="form-container">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Título de la Tarea</mat-label>
      <input matInput formControlName="title" placeholder="Ej: Diseñar la base de datos">
      <mat-icon matSuffix>assignment</mat-icon>
      <mat-error *ngIf="form.get('title')?.hasError('required')">
        El título es obligatorio
      </mat-error>
      <mat-error *ngIf="form.get('title')?.hasError('minlength')">
        Mínimo 3 caracteres
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Descripción</mat-label>
      <textarea matInput formControlName="description"
        placeholder="Descripción detallada..."
        rows="3"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Proyecto</mat-label>
      <mat-select formControlName="projectId">
        <mat-option *ngFor="let p of data.projects" [value]="p.id">
          {{ p.name }}
        </mat-option>
      </mat-select>
      <mat-icon matSuffix>folder</mat-icon>
      <mat-error *ngIf="form.get('projectId')?.hasError('required')">
        Seleccione un proyecto
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Estado</mat-label>
      <mat-select formControlName="status">
        <mat-option *ngFor="let opt of statusOptions" [value]="opt.value">
          {{ opt.label }}
        </mat-option>
      </mat-select>
      <mat-icon matSuffix>flag</mat-icon>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="saving">Cancelar</button>
  <button mat-raised-button color="primary" (click)="submit()"
    [disabled]="form.invalid || saving">
    <mat-spinner *ngIf="saving" diameter="20"></mat-spinner>
    <span *ngIf="!saving">{{ isEdit ? 'Actualizar' : 'Crear' }}</span>
  </button>
</mat-dialog-actions>
